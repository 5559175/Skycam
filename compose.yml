# skycam
# 

services:
  skycam:
    build: /docker/docker_data/skycam  # Points to your folder with the Dockerfile
    container_name: skycam
    ports:
      - "5050:5050"
    environment:
      - TZ=Europe/London
    volumes:
      - /docker/docker_data/skycam:/app
      - /export/media/skycam:/export/media/skycam
      - /export/media/meteors:/export/media/meteors
      - /root/MetDetPy:/root/MetDetPy
      - /root/.local/share/uv:/root/.local/share/uv:ro
      - /export/media/meteors:/export/media/meteors
    working_dir: /app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    # We keep the chmod/sed here just to handle script permissions on the fly
    entrypoint: /bin/bash -c "chmod +x /app/*.sh && sed -i 's/\r$//' /app/*.sh && python3 app.py"
